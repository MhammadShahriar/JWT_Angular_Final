<p-table [value]="users" [paginator]="true" [rows]="5" [rowsPerPageOptions]="[5, 10, 20]">

    <ng-template #header>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Nationality</th>
        </tr>
    </ng-template>

    <ng-template #body let-user>
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.name | uppercase }}</td>
            <td>{{ user.age }}</td>
            <td>{{ user.nationality }}</td>
        </tr>
    </ng-template>

</p-table>
