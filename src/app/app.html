  :host {
    display: block;
    padding: 20px;
}

p-table {
    display: block;
    width: 100%;
}
</style>

<h1>Hello, {{ title() }}</h1>

<h2>Users</h2>



<table class="table table-striped table-bordered">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Nationality</th>
        </tr>
        <tr>
            <td>user.id </td>
            <td> user.name </td>
            <td> user.age </td>
            <td>user.nationality </td>
        </tr>
</table>



<p-table [value]="users">

    <ng-template pTemplate="header">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Nationality</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.name | uppercase }}</td>
            <td>{{ user.age }}</td>
            <td>{{ user.nationality }}</td>
        </tr>
    </ng-template>

</p-table>

<nav>
    <a routerLink="/">Login</a><br/>
    <a routerLink="/home">Home</a><br/>
    <a routerLink="/about">About</a><br/>
    <a routerLink="/users">Users</a>
</nav>
